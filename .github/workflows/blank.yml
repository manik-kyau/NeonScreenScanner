name: Build NeonScreenScanner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o NeonScreenScanner_Native_Android_Project_v3-4.zip -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Kotlin dependencies
        working-directory: android-project/NeonScreenScanner
        run: |
          cat >> app/build.gradle <<'EOF'

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin') {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Build Android project
        working-directory: android-project/NeonScreenScanner
        run: |
          gradle assembleDebug        working-directory: android-project/NeonScreenScanner
        run: |
          gradle assembleDebug
