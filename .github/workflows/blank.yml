name: Build NeonScreenScanner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o NeonScreenScanner_Native_Android_Project_v3-4.zip -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and build Android project
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find android-project -maxdepth 3 -type f
            exit 1
          fi

          echo "Found gradlew at: $GRADLEW"
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug
