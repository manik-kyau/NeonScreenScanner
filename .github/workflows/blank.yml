name: Build NeonScreenScanner Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o NeonScreenScanner_Native_Android_Project_v3-4.zip -d android-project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix Kotlin dependencies
        working-directory: android-project/NeonScreenScanner
        run: |
          sed -i 's/kotlin-stdlib-jdk8:1.6.21/kotlin-stdlib:1.8.22/g' app/build.gradle
          sed -i 's/kotlin-stdlib-jdk7:1.6.21/kotlin-stdlib:1.8.22/g' app/build.gradle
          sed -i 's/kotlin-stdlib-jdk8:1.6.21/kotlin-stdlib:1.8.22/g' build.gradle
          sed -i 's/kotlin-stdlib-jdk7:1.6.21/kotlin-stdlib:1.8.22/g' build.gradle

      - name: Build Android project
        working-directory: android-project/NeonScreenScanner
        run: |
          gradle assembleDebug
